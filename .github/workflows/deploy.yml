name: Deploy Telegram Bot

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.128.55.105
          username: tamdang
          port: 22
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/telegram-bot
            git pull origin main
            sudo docker compose up -d --build
            sudo docker compose ps
